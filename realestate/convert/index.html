<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NX4JK10SS6"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-NX4JK10SS6');</script>

<!-- AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3741035032582828" crossorigin="anonymous"></script>

<title>전월세 전환 계산기 - 전세↔월세 변환 | 모든 계산기</title>
<meta name="description" content="전세와 월세를 법정전환율 기준으로 간편하게 전환 계산하세요.">
<link rel="canonical" href="https://moduncalc.com/realestate/convert/">
<meta property="og:type" content="website">
<meta property="og:title" content="전월세 전환 계산기 - 전세↔월세 변환 | 모든 계산기">
<meta property="og:description" content="전세와 월세를 법정전환율 기준으로 간편하게 전환 계산하세요.">
<meta property="og:url" content="https://moduncalc.com/realestate/convert/">
<meta name="robots" content="index, follow">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/common/style.css">
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">2026 법정전환율 기준</div>
    <h1>전월세 전환 계산기</h1>
    <p>전세와 월세를 법정전환율 기준으로 전환해 드려요.</p>
  </header>

  <section class="card">
    <h2 class="sec-title"><span class="num">1</span>전환 정보</h2>

    <div class="field">
      <label class="lbl">전환 방향</label>
      <div class="seg" id="segDirection">
        <button class="on" data-val="전세→월세">전세→월세</button>
        <button data-val="월세→전세">월세→전세</button>
      </div>
    </div>

    <div class="field" id="fieldJeonse">
      <label class="lbl">전세보증금 <span class="hint" id="jeonseLabel">30,000만원</span></label>
      <div class="amt-row">
        <input type="number" id="jeonse" value="30000" min="0" step="100" inputmode="numeric">
        <span class="unit">만원</span>
      </div>
      <input type="range" id="jeonseRange" min="0" max="100000" step="500" value="30000">
    </div>

    <div class="field" id="fieldMonthDeposit">
      <label class="lbl">월세 보증금 <span class="hint" id="monthDepositLabel">5,000만원</span></label>
      <div class="amt-row">
        <input type="number" id="monthDeposit" value="5000" min="0" step="100" inputmode="numeric">
        <span class="unit">만원</span>
      </div>
      <input type="range" id="monthDepositRange" min="0" max="50000" step="500" value="5000">
    </div>

    <div class="field" id="fieldMonthRent" style="display:none">
      <label class="lbl">월세 <span class="hint" id="monthRentLabel">50만원</span></label>
      <div class="amt-row">
        <input type="number" id="monthRent" value="50" min="0" step="1" inputmode="numeric">
        <span class="unit">만원</span>
      </div>
      <input type="range" id="monthRentRange" min="0" max="500" step="5" value="50">
    </div>

    <div class="field">
      <label class="lbl">전환율 <span class="hint">2026년 법정전환율 기준</span></label>
      <div class="amt-row">
        <input type="number" id="convRate" value="4.5" min="0" max="20" step="0.1" inputmode="decimal">
        <span class="unit">%</span>
      </div>
    </div>
  </section>

  <div id="convertResults"><div class="card empty">버튼을 누르면 전월세 전환 결과를 계산해 드려요.</div></div>

  <footer>
    <b>계산 가정</b><br>
    · 전월세 전환율: 2026년 법정전환율 4.5% 기준

    <div class="disclaimer">
      <b>면책 안내</b><br>
      이 계산기는 일반적인 세율과 공개 기준을 바탕으로 한 추정치를 제공하며, 실제 전환금액과 다를 수 있습니다. 정확한 금액은 공인중개사에게 확인하세요. 본 서비스 이용으로 발생한 손해에 대해 책임지지 않습니다.
    </div>
  </footer>

  <div class="cta-bar"><button class="cta" id="calcBtn">전환 계산하기</button></div>
</div>

<script src="/common/nav.js"></script>
<script>
/* ---- 세그먼트 헬퍼 ---- */
function segVal(id){
  const on=document.querySelector('#'+id+' button.on');
  return on?on.dataset.val:'';
}
function initSeg(id,cb){
  document.querySelectorAll('#'+id+' button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b===btn));
      if(cb) cb(btn.dataset.val);
    });
  });
}

/* ---- 입력 동기화 ---- */
const jeonseInput=document.getElementById('jeonse');
const jeonseRange=document.getElementById('jeonseRange');
function syncJeonse(v){
  v=Math.max(0,Math.round(v));
  jeonseInput.value=v;jeonseRange.value=Math.min(100000,v);
  document.getElementById('jeonseLabel').textContent=v.toLocaleString('ko-KR')+'만원';
}
jeonseInput.addEventListener('input',e=>syncJeonse(+e.target.value||0));
jeonseRange.addEventListener('input',e=>syncJeonse(+e.target.value));
syncJeonse(30000);

const mdInput=document.getElementById('monthDeposit');
const mdRange=document.getElementById('monthDepositRange');
function syncMD(v){
  v=Math.max(0,Math.round(v));
  mdInput.value=v;mdRange.value=Math.min(50000,v);
  document.getElementById('monthDepositLabel').textContent=v.toLocaleString('ko-KR')+'만원';
}
mdInput.addEventListener('input',e=>syncMD(+e.target.value||0));
mdRange.addEventListener('input',e=>syncMD(+e.target.value));
syncMD(5000);

const mrInput=document.getElementById('monthRent');
const mrRange=document.getElementById('monthRentRange');
function syncMR(v){
  v=Math.max(0,Math.round(v*10)/10);
  mrInput.value=v;mrRange.value=Math.min(500,v);
  document.getElementById('monthRentLabel').textContent=v.toLocaleString('ko-KR')+'만원';
}
mrInput.addEventListener('input',e=>syncMR(+e.target.value||0));
mrRange.addEventListener('input',e=>syncMR(+e.target.value));
syncMR(50);

/* 전환 방향 세그먼트 */
initSeg('segDirection',function(dir){
  const toMonthly=(dir==='전세→월세');
  document.getElementById('fieldJeonse').style.display=toMonthly?'':'none';
  document.getElementById('fieldMonthDeposit').style.display=toMonthly?'':'';
  document.getElementById('fieldMonthRent').style.display=toMonthly?'none':'';
});

/* ---- 전월세 전환 계산 ---- */
document.getElementById('calcBtn').addEventListener('click',calcConvert);

function calcConvert(){
  const dir=segVal('segDirection');
  const convRate=+(document.getElementById('convRate').value)||4.5;

  let html='<div class="result-head">전환 계산 결과</div>';

  if(dir==='전세→월세'){
    const jeonseAmt=+(jeonseInput.value)||0;
    const depositAmt=+(mdInput.value)||0;
    if(depositAmt>=jeonseAmt){
      html+='<div class="card empty">월세 보증금이 전세보증금보다 작아야 합니다.</div>';
      document.getElementById('convertResults').innerHTML=html;
      return;
    }
    const diff=jeonseAmt-depositAmt;
    const monthlyRent=diff*convRate/100/12;
    const annualRent=monthlyRent*12;

    html+=`<div class="rcard best">
      <span class="tag blue">전세 → 월세 전환</span>
      <h3>전환 월세</h3>
      <div class="sub">전세 ${jeonseAmt.toLocaleString('ko-KR')}만원 → 보증금 ${depositAmt.toLocaleString('ko-KR')}만원 + 월세</div>
      <div class="big-amt">${won(monthlyRent*10000)}<small>/월</small></div>
      <div class="breakdown">
        <div class="brow"><span class="k">전세보증금</span><span class="v">${won(jeonseAmt*10000)}</span></div>
        <div class="brow"><span class="k">월세 보증금</span><span class="v">${won(depositAmt*10000)}</span></div>
        <div class="brow"><span class="k">전환 차액</span><span class="v">${won(diff*10000)}</span></div>
        <div class="brow"><span class="k">적용 전환율</span><span class="v">${convRate}%</span></div>
      </div>
      <div class="effect-box">
        <div class="eff-top">연간 비용 비교</div>
        <div class="eff-num">연 월세 합계 ${won(annualRent*10000)}</div>
        <div class="eff-sub">보증금 차액 ${won(diff*10000)}에 대한 전환율 ${convRate}% 적용</div>
      </div>
    </div>`;
  } else {
    const monthlyRent=+(mrInput.value)||0;
    const mDeposit=+(mdInput.value)||0;
    const convertedJeonse=mDeposit+(monthlyRent*12/(convRate/100));
    const annualRent=monthlyRent*12;

    html+=`<div class="rcard best">
      <span class="tag violet">월세 → 전세 전환</span>
      <h3>전환 전세금</h3>
      <div class="sub">보증금 ${mDeposit.toLocaleString('ko-KR')}만원 + 월세 ${monthlyRent.toLocaleString('ko-KR')}만원</div>
      <div class="big-amt">${won(convertedJeonse*10000)}</div>
      <div class="breakdown">
        <div class="brow"><span class="k">현재 보증금</span><span class="v">${won(mDeposit*10000)}</span></div>
        <div class="brow"><span class="k">현재 월세</span><span class="v">${won(monthlyRent*10000)}/월</span></div>
        <div class="brow"><span class="k">적용 전환율</span><span class="v">${convRate}%</span></div>
        <div class="brow"><span class="k">전환 전세금</span><span class="v">${won(convertedJeonse*10000)}</span></div>
      </div>
      <div class="effect-box">
        <div class="eff-top">연간 비용 비교</div>
        <div class="eff-num">연 월세 ${won(annualRent*10000)} → 전세 전환 시 0원</div>
        <div class="eff-sub">추가 보증금 ${won((convertedJeonse-mDeposit)*10000)} 필요 (전환율 ${convRate}%)</div>
      </div>
    </div>`;
  }

  html+='<div class="result-note">법정전환율은 한국은행 기준금리+대통령령 이율로 결정되며, 실제 계약 조건과 다를 수 있어요.</div>';
  document.getElementById('convertResults').innerHTML=html;
  document.getElementById('convertResults').scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
