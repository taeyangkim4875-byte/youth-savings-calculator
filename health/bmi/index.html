<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NX4JK10SS6"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-NX4JK10SS6');</script>

<!-- AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3741035032582828" crossorigin="anonymous"></script>

<title>BMI 계산기 - 체질량지수 계산 · 비만도 판정 | 모든 계산기</title>
<meta name="description" content="키와 체중으로 BMI(체질량지수)를 계산하고 비만도를 확인하세요. WHO 아시아태평양 기준.">
<link rel="canonical" href="https://moduncalc.com/health/bmi/">
<meta property="og:type" content="website">
<meta property="og:title" content="BMI 계산기 - 체질량지수 계산 · 비만도 판정 | 모든 계산기">
<meta property="og:description" content="키와 체중으로 BMI(체질량지수)를 계산하고 비만도를 확인하세요. WHO 아시아태평양 기준.">
<meta property="og:url" content="https://moduncalc.com/health/bmi/">
<meta name="robots" content="index, follow">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/common/style.css">
</head>
<body>

<div class="wrap">

  <header>
    <div class="eyebrow">WHO 아시아태평양 기준</div>
    <h1>BMI 계산기</h1>
    <p>키와 체중을 입력하면 BMI와 비만도를 알려드려요.</p>
  </header>

  <div class="card">
    <div class="sec-title"><span class="num">1</span> 신체 정보</div>

    <div class="field">
      <label class="lbl">키 <span class="hint" id="heightLabel">170 cm</span></label>
      <div class="amt-row">
        <input type="number" id="heightInput" value="170" min="130" max="210">
        <span class="unit">cm</span>
      </div>
      <input type="range" id="heightRange" min="130" max="210" value="170">
    </div>

    <div class="field">
      <label class="lbl">체중 <span class="hint" id="weightLabel">70 kg</span></label>
      <div class="amt-row">
        <input type="number" id="weightInput" value="70" min="30" max="150">
        <span class="unit">kg</span>
      </div>
      <input type="range" id="weightRange" min="30" max="150" value="70">
    </div>
  </div>

  <div id="bmiResults"></div>

  <!-- BMI 분류 참고표 -->
  <div class="card" style="margin-top:6px">
    <div class="tbl-cap">📊 BMI 분류 기준표</div>
    <table class="dtable">
      <thead><tr><th>분류</th><th>BMI 범위</th></tr></thead>
      <tbody>
        <tr><td>저체중</td><td>&lt; 18.5</td></tr>
        <tr><td>정상</td><td>18.5 – 22.9</td></tr>
        <tr><td>과체중</td><td>23.0 – 24.9</td></tr>
        <tr><td>비만 1단계</td><td>25.0 – 29.9</td></tr>
        <tr><td>비만 2단계</td><td>30.0 – 34.9</td></tr>
        <tr><td>고도비만</td><td>≥ 35.0</td></tr>
      </tbody>
    </table>
    <div class="tbl-src">출처: WHO 아시아태평양 기준</div>
  </div>

  <footer>
    <div class="disclaimer">
      <b>⚠️ 참고 안내</b><br>
      BMI는 체지방률을 직접 측정하지 않으며, 근육량이 많은 경우 실제보다 높게 나올 수 있습니다. 정확한 건강 상태 확인은 전문의와 상담하세요.
    </div>
  </footer>

</div><!-- .wrap -->

<!-- CTA -->
<div class="cta-bar">
  <button class="cta" id="calcBtn">BMI 계산하기</button>
</div>

<script src="/common/nav.js"></script>
<script>
(function(){

  const heightIn = document.getElementById('heightInput');
  const heightRng = document.getElementById('heightRange');
  const weightIn = document.getElementById('weightInput');
  const weightRng = document.getElementById('weightRange');
  const heightLbl = document.getElementById('heightLabel');
  const weightLbl = document.getElementById('weightLabel');

  function syncHeight(){ heightLbl.textContent = heightIn.value + ' cm'; }
  function syncWeight(){ weightLbl.textContent = weightIn.value + ' kg'; }

  heightIn.addEventListener('input', ()=>{ heightRng.value=heightIn.value; syncHeight(); });
  heightRng.addEventListener('input', ()=>{ heightIn.value=heightRng.value; syncHeight(); });
  weightIn.addEventListener('input', ()=>{ weightRng.value=weightIn.value; syncWeight(); });
  weightRng.addEventListener('input', ()=>{ weightIn.value=weightRng.value; syncWeight(); });

  document.getElementById('calcBtn').addEventListener('click', calcBMI);

  function calcBMI(){
    const h = parseFloat(heightIn.value);
    const w = parseFloat(weightIn.value);
    if(!h||!w||h<=0||w<=0) return;

    const bmi = w / Math.pow(h/100, 2);
    const bmiVal = bmi.toFixed(1);

    let cat, color, tagClass;
    if(bmi < 18.5)      { cat='저체중'; color='#3182F6'; tagClass='blue'; }
    else if(bmi < 23)    { cat='정상';   color='#00C271'; tagClass='green'; }
    else if(bmi < 25)    { cat='과체중'; color='#F5A623'; tagClass='violet'; }
    else if(bmi < 30)    { cat='비만 1단계'; color='#E5484D'; tagClass='violet'; }
    else if(bmi < 35)    { cat='비만 2단계'; color='#E5484D'; tagClass='violet'; }
    else                 { cat='고도비만'; color='#E5484D'; tagClass='violet'; }

    const hm = h / 100;
    const normalLow = (18.5 * hm * hm).toFixed(1);
    const normalHigh = (22.9 * hm * hm).toFixed(1);
    const stdWeight = (22 * hm * hm).toFixed(1);

    const pct = Math.min(100, Math.max(0, (bmi - 10) / 30 * 100));

    const el = document.getElementById('bmiResults');
    el.innerHTML = `
      <div class="rcard best">
        <span class="tag ${tagClass}">${cat}</span>
        <div class="pct-hero">
          <div class="pct-top">나의 BMI</div>
          <div class="pct-big" style="color:${color}">${bmiVal}<small>kg/m²</small></div>
          <div class="pct-sub">${cat} 범위에 해당합니다</div>
        </div>
        <div class="gauge" style="background:linear-gradient(90deg,#3182F6 0%,#00C271 28%,#F5A623 43%,#E5484D 60%,#9E1A1A 100%)">
          <div class="pin" style="left:${pct}%"></div>
        </div>
        <div class="gauge-scale"><span>10</span><span>18.5</span><span>23</span><span>25</span><span>30</span><span>40</span></div>
        <div class="breakdown">
          <div class="brow"><span class="k">키</span><span class="v">${h} cm</span></div>
          <div class="brow"><span class="k">체중</span><span class="v">${w} kg</span></div>
          <div class="brow"><span class="k">표준 체중 (BMI 22)</span><span class="v">${stdWeight} kg</span></div>
          <div class="brow green"><span class="k">정상 체중 범위</span><span class="v">${normalLow} – ${normalHigh} kg</span></div>
        </div>
        ${bmi >= 23 ? `<div class="effect-box"><div class="eff-top">정상 체중까지</div><div class="eff-num">${(w - parseFloat(normalHigh)).toFixed(1)} kg 감량 필요</div><div class="eff-sub">BMI 22.9 기준</div></div>` : ''}
        ${bmi < 18.5 ? `<div class="effect-box"><div class="eff-top">정상 체중까지</div><div class="eff-num">${(parseFloat(normalLow) - w).toFixed(1)} kg 증량 필요</div><div class="eff-sub">BMI 18.5 기준</div></div>` : ''}
      </div>
    `;
    el.scrollIntoView({behavior:'smooth', block:'start'});

    document.querySelectorAll('.dtable tbody tr').forEach(tr=>tr.classList.remove('hl'));
    const rows = document.querySelectorAll('.dtable tbody tr');
    let idx = 0;
    if(bmi>=18.5) idx=1; if(bmi>=23) idx=2; if(bmi>=25) idx=3; if(bmi>=30) idx=4; if(bmi>=35) idx=5;
    if(rows[idx]) rows[idx].classList.add('hl');
  }

  calcBMI();

})();
</script>
</body>
</html>
