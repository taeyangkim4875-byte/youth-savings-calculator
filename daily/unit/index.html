<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>단위 변환기 - 길이·무게·온도·면적 변환 | 모든 계산기</title>
<meta name="description" content="길이, 무게, 온도, 면적을 한 번에 변환해요." />
<link rel="canonical" href="https://moduncalc.com/daily/unit/">
<meta property="og:type" content="website" />
<meta property="og:title" content="단위 변환기 - 길이·무게·온도·면적 변환 | 모든 계산기" />
<meta property="og:description" content="길이, 무게, 온도, 면적을 한 번에 변환해요." />
<meta property="og:url" content="https://moduncalc.com/daily/unit/" />
<meta name="robots" content="index, follow" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NX4JK10SS6"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-NX4JK10SS6');</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3741035032582828" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/common/style.css">
<style>
  .live-result{background:var(--primary-weak);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
  .live-result .lr-big{font-size:28px;font-weight:800;color:var(--primary-dark);letter-spacing:-.5px}
  .live-result .lr-sub{font-size:12px;color:var(--sub);margin-top:4px}
  .unit-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .unit-row input{flex:1;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-weight:700;
    color:var(--ink);font-family:inherit;outline:none;background:#fff}
  .unit-row input:focus{border-color:var(--primary)}
  .unit-row .u-label{font-size:13px;font-weight:700;color:var(--sub);width:36px;text-align:center;flex:none}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid-2 .live-result{margin-top:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">단위 변환</div>
    <h1>단위 변환기</h1>
    <p>길이, 무게, 온도, 면적을 한 번에 변환해요.</p>
  </header>

  <section class="card">
    <h2 class="sec-title"><span class="num">📏</span>길이</h2>
    <div class="unit-row"><input type="number" id="uLenA" value="1" inputmode="decimal"><span class="u-label">m</span></div>
    <div class="grid-2">
      <div class="live-result" id="uLenCm"><div class="lr-big">100</div><div class="lr-sub">cm</div></div>
      <div class="live-result" id="uLenFt"><div class="lr-big">3.281</div><div class="lr-sub">ft</div></div>
      <div class="live-result" id="uLenIn"><div class="lr-big">39.37</div><div class="lr-sub">inch</div></div>
      <div class="live-result" id="uLenKm"><div class="lr-big">0.001</div><div class="lr-sub">km</div></div>
    </div>
  </section>

  <section class="card">
    <h2 class="sec-title"><span class="num">⚖️</span>무게</h2>
    <div class="unit-row"><input type="number" id="uWtA" value="1" inputmode="decimal"><span class="u-label">kg</span></div>
    <div class="grid-2">
      <div class="live-result" id="uWtG"><div class="lr-big">1,000</div><div class="lr-sub">g</div></div>
      <div class="live-result" id="uWtLb"><div class="lr-big">2.205</div><div class="lr-sub">lb (파운드)</div></div>
      <div class="live-result" id="uWtOz"><div class="lr-big">35.27</div><div class="lr-sub">oz (온스)</div></div>
      <div class="live-result" id="uWtGn"><div class="lr-big">266.7</div><div class="lr-sub">근</div></div>
    </div>
  </section>

  <section class="card">
    <h2 class="sec-title"><span class="num">🌡️</span>온도</h2>
    <div class="unit-row"><input type="number" id="uTempA" value="36.5" inputmode="decimal"><span class="u-label">℃</span></div>
    <div class="grid-2">
      <div class="live-result" id="uTempF"><div class="lr-big">97.7</div><div class="lr-sub">℉ (화씨)</div></div>
      <div class="live-result" id="uTempK"><div class="lr-big">309.65</div><div class="lr-sub">K (절대온도)</div></div>
    </div>
  </section>

  <section class="card">
    <h2 class="sec-title"><span class="num">📐</span>면적</h2>
    <div class="unit-row"><input type="number" id="uAreaA" value="33" inputmode="decimal"><span class="u-label">㎡</span></div>
    <div class="grid-2">
      <div class="live-result" id="uAreaPy"><div class="lr-big">9.98</div><div class="lr-sub">평</div></div>
      <div class="live-result" id="uAreaFt"><div class="lr-big">355.2</div><div class="lr-sub">ft²</div></div>
    </div>
  </section>
</div>

<script src="/common/nav.js"></script>
<script>
(function(){
var fmt = function(n){
  if(n===null||isNaN(n)) return '\u2014';
  var a=Math.abs(n);
  if(a===Infinity) return '\u221e';
  if(a>=1) return parseFloat(n.toFixed(2)).toLocaleString('ko-KR');
  return parseFloat(n.toFixed(4)).toLocaleString('ko-KR',{maximumFractionDigits:4});
};

document.getElementById('uLenA').addEventListener('input',function(){
  var v=+this.value||0;
  document.getElementById('uLenCm').querySelector('.lr-big').textContent=fmt(v*100);
  document.getElementById('uLenFt').querySelector('.lr-big').textContent=fmt(v*3.28084);
  document.getElementById('uLenIn').querySelector('.lr-big').textContent=fmt(v*39.3701);
  document.getElementById('uLenKm').querySelector('.lr-big').textContent=fmt(v/1000);
});
document.getElementById('uWtA').addEventListener('input',function(){
  var v=+this.value||0;
  document.getElementById('uWtG').querySelector('.lr-big').textContent=fmt(v*1000);
  document.getElementById('uWtLb').querySelector('.lr-big').textContent=fmt(v*2.20462);
  document.getElementById('uWtOz').querySelector('.lr-big').textContent=fmt(v*35.274);
  document.getElementById('uWtGn').querySelector('.lr-big').textContent=fmt(v/0.6*1);
});
document.getElementById('uTempA').addEventListener('input',function(){
  var v=+this.value||0;
  document.getElementById('uTempF').querySelector('.lr-big').textContent=fmt(v*9/5+32);
  document.getElementById('uTempK').querySelector('.lr-big').textContent=fmt(v+273.15);
});
document.getElementById('uAreaA').addEventListener('input',function(){
  var v=+this.value||0;
  document.getElementById('uAreaPy').querySelector('.lr-big').textContent=fmt(v/3.3058);
  document.getElementById('uAreaFt').querySelector('.lr-big').textContent=fmt(v*10.7639);
});
})();
</script>
</body>
</html>
