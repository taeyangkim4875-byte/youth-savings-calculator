<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>D-day 계산기 - 날짜 차이·날짜 더하기 | 모든 계산기</title>
<meta name="description" content="두 날짜 사이 일수와 날짜 더하기를 계산해요." />
<link rel="canonical" href="https://moduncalc.com/daily/dday/">
<meta property="og:type" content="website" />
<meta property="og:title" content="D-day 계산기 - 날짜 차이·날짜 더하기 | 모든 계산기" />
<meta property="og:description" content="두 날짜 사이 일수와 날짜 더하기를 계산해요." />
<meta property="og:url" content="https://moduncalc.com/daily/dday/" />
<meta name="robots" content="index, follow" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NX4JK10SS6"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-NX4JK10SS6');</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3741035032582828" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/common/style.css">
<style>
  .live-result{background:var(--primary-weak);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
  .live-result .lr-big{font-size:28px;font-weight:800;color:var(--primary-dark);letter-spacing:-.5px}
  .live-result .lr-sub{font-size:12px;color:var(--sub);margin-top:4px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">날짜 계산</div>
    <h1>D-day 계산기</h1>
    <p>두 날짜 사이 일수와 날짜 더하기를 계산해요.</p>
  </header>

  <section class="card">
    <h2 class="sec-title"><span class="num">📅</span>D-day 계산</h2>
    <div class="field">
      <label class="lbl">기준 날짜</label>
      <div class="amt-row"><input type="date" id="ddayFrom" style="flex:1;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;color:var(--ink)"></div>
    </div>
    <div class="field">
      <label class="lbl">목표 날짜</label>
      <div class="amt-row"><input type="date" id="ddayTo" style="flex:1;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;color:var(--ink)"></div>
    </div>
    <div class="live-result" id="ddayR" style="display:none"><div class="lr-big"></div><div class="lr-sub"></div></div>
  </section>

  <section class="card">
    <h2 class="sec-title"><span class="num">📆</span>날짜 더하기/빼기</h2>
    <div class="field">
      <label class="lbl">시작 날짜</label>
      <div class="amt-row"><input type="date" id="dateAddFrom" style="flex:1;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;color:var(--ink)"></div>
    </div>
    <div class="field">
      <label class="lbl">더할 일수 <span class="hint">빼려면 음수 입력</span></label>
      <div class="amt-row"><input type="number" id="dateAddDays" value="100" inputmode="numeric"><span class="unit">일</span></div>
    </div>
    <div class="live-result" id="dateAddR"><div class="lr-big">—</div><div class="lr-sub">결과 날짜</div></div>
  </section>
</div>

<script src="/common/nav.js"></script>
<script>
(function(){
var DAYS=['\uc77c','\uc6d4','\ud654','\uc218','\ubaa9','\uae08','\ud1a0'];
var ddF=document.getElementById('ddayFrom'),ddT=document.getElementById('ddayTo');
ddF.value=new Date().toISOString().slice(0,10);
function liveDday(){
  if(!ddF.value||!ddT.value){document.getElementById('ddayR').style.display='none';return;}
  var a=new Date(ddF.value+'T00:00:00'),b=new Date(ddT.value+'T00:00:00');
  var diff=Math.round((b-a)/(864e5)),abs=Math.abs(diff);
  var w=Math.floor(abs/7),r=abs%7;
  var label=diff>0?'D-'+diff:diff<0?'D+'+abs:'D-Day';
  var sub=diff>0?'\ubaa9\ud45c\uc77c\uae4c\uc9c0 '+abs+'\uc77c':diff<0?abs+'\uc77c \uc9c0\ub0a8':'\uc624\ub298\uc774\uc5d0\uc694!';
  if(w>0) sub+=' ('+w+'\uc8fc '+r+'\uc77c)';
  sub+=' \xb7 '+ddT.value+' ('+DAYS[b.getDay()]+'\uc694\uc77c)';
  document.getElementById('ddayR').style.display='';
  document.getElementById('ddayR').innerHTML='<div class="lr-big">'+label+'</div><div class="lr-sub">'+sub+'</div>';
}
ddF.addEventListener('change',liveDday);ddT.addEventListener('change',liveDday);

var daF=document.getElementById('dateAddFrom'),daD=document.getElementById('dateAddDays');
daF.value=new Date().toISOString().slice(0,10);
function liveDateAdd(){
  if(!daF.value)return;
  var d=new Date(daF.value+'T00:00:00');
  d.setDate(d.getDate()+(+daD.value||0));
  var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  document.getElementById('dateAddR').innerHTML='<div class="lr-big">'+y+'-'+m+'-'+day+'</div><div class="lr-sub">'+DAYS[d.getDay()]+'\uc694\uc77c</div>';
}
daF.addEventListener('change',liveDateAdd);daD.addEventListener('input',liveDateAdd);
liveDateAdd();
})();
</script>
</body>
</html>
